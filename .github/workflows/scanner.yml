name: Crypto Hunter Scanner

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner
        run: python phase1_scanner.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: |
            result.txt
            result.html
